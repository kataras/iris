Server:
  Addr: ":8080" # Address to listen on.
  # SSHTunnel:
  #   Domain: "serveo.net" # Remote SSH server to use for tunneling.
  #   LocalPort: 8080 # Local port to forward to.
  # Iris.
  Name: "Hellenic Identity Server"
  # Host: "id.hellenic.dev"
  LogLevel: info
  Context:
    RemoteAddrHeaders:
      - "X-Real-Ip"
      - "X-Forwarded-For"
      - "CF-Connecting-IP"
      - "True-Client-Ip"
      - "X-Appengine-Remote-Addr"
Identity:
  ConnectionString: host=HOST port=5432 user=makis password=PASS search_path=public dbname=myDatabase sslmode=require pool_max_conns=12 pool_min_conns=1 pool_max_conn_lifetime=1h pool_max_conn_idle_time=45m pool_health_check_period=15m
  LoginPageURL: ""
  ConsentPageURL: ""
  EncryptionKey: 3b6c422b12f27b0b325744b0dddb44e9
  UsernameIsEmail: true  # Set to true to use email as username
  RestoreOnSamePasswordSignup: true # Set to true to allow users to restore their password if they try to sign up with the same username and password.
  Schema:
    # Example of schema using UserAttribute fields (YAML as list of objects):
    - Name: "firstname"
      Type: "text"
      Params: ["3", "55"]         # Field with type and parameters
    - Name: "lastname"
      Type: "text"
      Params: ["3", "55"]         # Default type is text
    # - Name: "age"
    #   Type: "number"
    #   Params: ["18", "105"]     # Numeric field with range
    # - Name: "email"
    #   Type: "email"
    #   Indexed: true               # Special case, type is inferred as email and indexed
    # - Name: "nickname"
    #   Type: "text"              # Text field with no length restrictions
    # - Name: "comments"
    #   Type: "text"              # Default text field with no restrictions
    - Name: "birthdate"
      Type: "date"
      Params: ["1900", "now"]     # Birth year between 1900 and current year
    # - Name: "phone"
    #   Type: "phone"             # Default to any reasonable phone format
    # - Name: "mobile"
    #   Type: "phone"
    #   Params: ["e164"]          # Require strict E.164 format
    # - Name: "work_phone"
    #   Type: "phone"
    #   Params: ["us"]            # Require North American format
    - Name: "phone"
      Type: "phone"
      Params: ["international"]   # Require international format, e.g. +44 20 1234 5678
      Required: true # Set to true to make this field required
  # To run dragonfly drom Docker, you can use the following commands:
  # First time:
  # sudo apt update
  # sudo apt install -y docker.io docker-compose
  # sudo systemctl start docker
  # sudo systemctl enable docker
  # sudo usermod -aG docker $USER
  # wsl --shutdown
  # wsl -d Ubuntu
  # Then, run the following commands to start Dragonfly:
  # sudo service docker start
  # docker run -d --name dragonfly -p 6379:6379 --ulimit memlock=-1 docker.dragonflydb.io/dragonflydb/dragonfly --requirepass 'admin!123'
  # docker rm -f dragonfly (to delete it).
  Cache:
    Disable: true
    Addr:     "127.0.0.1:6379"
    Password: "admin!123"
    TTL: 10m
    # The request headers that are part of a cache key. The cache knows
    # Authorization as a credential and skips a request that carries one the
    # key does not hold. It does not know X-Token (the client) or
    # X-Authorization (the user): they keep the entries of one caller apart
    # from another's only because they are named here, so keep them.
    # A client that also sends a cookie, the Auth.Cookie below for example,
    # is not cached until Cookies names every cookie it sends.
    Headers:
      - "X-Token"
      - "Authorization"
      - "X-Authorization"
    CommandTimeout: 15s
    StartupCleanup: true # If true, it will delete all keys in the cache on startup.
  Cost:
    CostPerSecond: 0.01
    CostPerMB:     0.001
    CostPerCPU:    0.02
  Auth:
    Headers: # required.
      - "Authorization"
      - "X-Authorization"
    Cookie: # optional.
      Name: "iris_auth_cookie"
      Secure: false
      Hash: "D*G-KaPdSgUkXp2s5v8y/B?E(H+MbQeThWmYq3t6w9z$C&F)J@NcRfUjXn2r4u7x" # length of 64 characters (512-bit).
      Block: "VkYp3s6v9y$B&E)H@McQfTjWmZq4t7w!" # length of 32 characters (256-bit).
    Keys:
      - ID: IRIS_AUTH_ACCESS # required.
        Alg: EdDSA
        MaxAge: 2h # 2 hours lifetime for access tokens. As fallback if app client does not provide a max age.
        Private: |+
          -----BEGIN PRIVATE KEY-----
          MC4CAQAwBQYDK2VwBCIEIFdZWoDdFny5SMnP9Fyfr8bafi/B527EVZh8JJjDTIFO
          -----END PRIVATE KEY-----
        Public: |+
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEAzpgjKSr9E032DX+foiOxq1QDsbzjLxagTN+yVpGWZB4=
          -----END PUBLIC KEY-----
      - ID: IRIS_AUTH_REFRESH # optional. Good practise to have it though.
        Alg: EdDSA
        # 1 month lifetime for refresh tokens,
        # after that period the user has to signin again.
        # This is the default value, if app client doesn't provide it.
        MaxAge: 720h 
        Private: |+
          -----BEGIN PRIVATE KEY-----
          MC4CAQAwBQYDK2VwBCIEIHJ1aoIjA2sRp5eqGjGR3/UMucrHbBdBv9p8uwfzZ1KZ
          -----END PRIVATE KEY-----
        Public: |+
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEAsKKAr+kDtfAqwG7cZdoEAfh9jHt9W8qi9ur5AA1KQAQ=
          -----END PUBLIC KEY-----
        # Example of setting a hex-encoded 16-byte random key.
        EncryptionKey: 3b6c422b12f27b0b325744b0dddb44e9
